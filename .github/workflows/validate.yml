name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore get-started-with-ai-agents-c-sharp.sln --locked-mode
      - name: Build
        run: dotnet build get-started-with-ai-agents-c-sharp.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test get-started-with-ai-agents-c-sharp.sln --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults
      - name: Verify formatting
        run: dotnet format get-started-with-ai-agents-c-sharp.sln --verify-no-changes --no-restore
      - name: Test zero-Python check
        shell: pwsh
        run: '& (Join-Path scripts test-no-python.ps1)'
      - name: Check for Python artifacts
        shell: pwsh
        run: '& (Join-Path scripts check-no-python.ps1)'
      - name: Report vulnerable dependencies
        run: dotnet list get-started-with-ai-agents-c-sharp.sln package --vulnerable --include-transitive --no-restore
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7
